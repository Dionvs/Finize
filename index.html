<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finize</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#6f8a55">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finize">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="icon" type="image/png" href="finize-logo.png">
  <link rel="stylesheet" href="./app.css?v=78-cloud-vervangen">
</head>
<body class="v4-app auth-pending">
<div id="authRoot" role="region" aria-label="Finize account" aria-live="polite">
  <span class="sr-only">Finize wordt voorbereid…</span>
</div>

<aside class="v4-sidebar">
  <div class="v4-sidebar-brand">
    <img src="finize-logo.png" alt="Finize logo">
    <div>
      <h1>Finize</h1>
      <div class="save-status" id="saveStatus">Lokaal opgeslagen op dit toestel</div>
    </div>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab-btn" data-tab="dashboard"><span class="u5-nav-icon"></span><span class="u5-nav-label">Dashboard</span></button>
    <button class="tab-btn" data-tab="gezamenlijk"><span class="u5-nav-icon"></span><span class="u5-nav-label">Gezamenlijk</span></button>
    <button class="tab-btn" data-tab="dion"><span class="u5-nav-icon"></span><span class="u5-nav-label">Dion</span></button>
    <button class="tab-btn" data-tab="dara"><span class="u5-nav-icon"></span><span class="u5-nav-label">Dara</span></button>
    <button class="tab-btn" data-tab="spaardoelen"><span class="u5-nav-icon"></span><span class="u5-nav-label">Spaardoelen</span></button>
    <button class="tab-btn" data-tab="data"><span class="u5-nav-icon"></span><span class="u5-nav-label">Data & back-up</span></button>
  </div>
  <div class="v4-sidebar-spacer"></div>
  <div class="v4-sidebar-card">
    <strong id="v4SidebarMonth">Maand</strong>
    <span id="v4SidebarScenario">Scenario</span>
  </div>
  <div class="v4-sidebar-foot"><span>Hulp & feedback</span><span>‹</span></div>
</aside>

<main class="v4-main">
<div class="v4-main-topbar">
  <div class="top-actions" id="topActionsHome">
    <div class="month-control" id="monthControl">
      <button type="button" class="month-picker-btn" id="monthPickerButton" aria-expanded="false" aria-controls="monthPickerPanel">Maand</button>
      <div class="month-popover" id="monthPickerPanel"></div>
    </div>
    <div class="scenario-toggle" id="scenarioToggle">
      <button data-scenario="voor">Voor verkoop</button>
      <button data-scenario="na">Na verkoop</button>
    </div>
    <button class="primary" data-open-transaction>+ Uitgave toevoegen</button>
  </div>
</div>

<div class="wrap" id="tab-dashboard"></div>
<div class="wrap" id="tab-gezamenlijk"></div>
<div class="wrap" id="tab-dion"></div>
<div class="wrap" id="tab-dara"></div>
<div class="wrap" id="tab-spaardoelen"></div>
<div class="wrap" id="tab-data"></div>

<div class="modal-backdrop" id="transactionModal"></div>
<div class="modal-backdrop" id="incomeEditModal"></div>
</main>

<nav class="v4-bottom-nav" id="bottomNav">
  <button type="button" class="bottom-nav-btn tab-btn" data-tab="dashboard">
    <span class="bn-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg></span><span>Dashboard</span>
  </button>
  <button type="button" class="bottom-nav-btn tab-btn" data-tab="gezamenlijk">
    <span class="bn-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 12a3 3 0 1 0 0-6a3 3 0 0 0 0 6ZM16 11a2.5 2.5 0 1 0 0-5a2.5 2.5 0 0 0 0 5ZM3 20a5 5 0 0 1 10 0M13 20a4 4 0 0 1 8 0"/></svg></span><span>Gezamenlijk</span>
  </button>
  <button type="button" class="bottom-nav-btn tab-btn" data-tab="dion">
    <span class="bn-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3"/><path d="M5 20a7 7 0 0 1 14 0"/><path d="M16.5 15.5l1.7 1.7l3.3-3.7"/></svg></span><span>Dion</span>
  </button>
  <button type="button" class="bottom-nav-btn tab-btn" data-tab="dara">
    <span class="bn-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3"/><path d="M5 20a7 7 0 0 1 14 0"/><path d="M16.5 15.5l1.7 1.7l3.3-3.7"/></svg></span><span>Dara</span>
  </button>
  <button type="button" class="bottom-nav-btn tab-btn" data-tab="spaardoelen">
    <span class="bn-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1.4"/><path d="M15 9l5-5M16.5 4H20v3.5"/></svg></span><span>Spaardoelen</span>
  </button>
</nav>

  <script src="./app.js?v=78-cloud-vervangen"></script>
</body>
</html>
