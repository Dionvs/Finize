name: Finize schaaltests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scale:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      FIREBASE_CLI_DISABLE_USAGE_REPORTING: '1'
      FINIZE_EVIDENCE_PREFIX: p44
      JAVA_TOOL_OPTIONS: -Xmx2g
      FINIZE_FIREBASE_CLI: ${{ github.workspace }}/.cache/ci-tools/node_modules/firebase-tools/lib/bin/firebase.js
      FINIZE_BANK_DEPENDENCIES: ${{ github.workspace }}/.cache/ci-tools
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - name: Afzonderlijke emulatorhulpmiddelen, zonder productierechten
        run: npm install --prefix .cache/ci-tools --no-save --ignore-scripts --no-audit --no-fund firebase-tools@15.24.0 firebase-admin@13.6.0
      - run: pnpm exec playwright install --with-deps chromium
      - name: Afzonderlijke schaal- en prestatietests met lokale Firestore
        run: node "$FINIZE_FIREBASE_CLI" emulators:exec --only firestore --project demo-finize-v117 --config firebase.emulator.json 'pnpm exec playwright test --grep "v117-p4-scale|v117-p4-write-amplification|v117-p42-performance|v117-p43-performance|v117-p44-performance|v117-p44-scale-verifier|existing 500 and 5400|completed 500-source" --reporter=line,json'
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/full.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scale-test-results
          path: |
            test-results/
            playwright-report/
            backups/v117-stabilisatie/
          if-no-files-found: ignore
          retention-days: 7
